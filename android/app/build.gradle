// File: android/app/build.gradle

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.chaquo.python'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.example.my_kia_query"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xskip-metadata-version-check'
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main {
            python.srcDirs = ['src/main/python']
        }
    }

    defaultConfig {
        applicationId "com.example.my_kia_query"
        // Set minimum SDK version to 23 for biometric support
        minSdkVersion Math.max(23, flutter.minSdkVersion)
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Enable backup
        resValue "bool", "BACKUP_ENABLED", "true"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            pip {
                install "hyundai-kia-connect-api"
            }
            buildPython "/usr/bin/python3"
            version "3.9"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Enable shrinking, obfuscation, and optimization for release builds
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Enable backup for debug builds as well
            manifestPlaceholders = [BACKUP_ENABLED: true]
        }
    }

    // Ensure data persistence
    aaptOptions {
        noCompress "xml"
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.annotation:annotation:1.7.1"
}

